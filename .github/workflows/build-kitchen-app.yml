name: Build kitchen Android app (Capacitor)

on:
  push:
    branches: [main]
    paths:
      - "capacitor-kitchen-app/**"
      - "admin.html"
      - "site.config.js"
      - "js/firebase-auth.js"
      - "admin-manifest.json"
      - ".github/workflows/build-kitchen-app.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: capacitor-kitchen-app

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Override in the workflow_dispatch UI or here once you know the real
      # production domain — see capacitor-kitchen-app/README.md.
      PROD_ORIGIN: ${{ vars.PROD_ORIGIN }}
      APP_ID: ${{ vars.APP_ID }}
      APP_NAME: ${{ vars.APP_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # matches compileSdk 36 (see android/variables.gradle)

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web assets (sync-web.js)
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: capacitor-kitchen-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-app-debug-apk
          path: capacitor-kitchen-app/android/app/build/outputs/apk/debug/app-debug.apk
